# guikit CI: lint -> build -> publish.
# NOTE: this workflow previously used actions/setup-python with cache: pip. Even with no
# cache-dependency-path given, that action still globs the repo for **/requirements.txt or
# **/pyproject.toml to build its cache key — and this repo has neither, so it always failed with
# "No file ... matched, make sure you have checked out the target repository". ubuntu-24.04 runners
# ship Python 3.12 preinstalled, so this workflow skips the action entirely and uses the system
# python3 / pip directly. mecha is installed straight from PyPI; no dependency file needed.
#  [1] least-privilege permissions   [2] concurrency        [3] pinned runner       [4] job timeouts
#  [5] manual inputs                 [6] weekly schedule    [8] lint matrix (all packs)
#  [9] JSON syntax check for every .json in the repo (mecha only parses .mcfunction, not json_files)
# [10] pack.mcmeta consistency check (root vs examples/guikit-demo: same min_format/max_format)
# [17] core + demo zips  [18] zip verification   [21] re-run mecha against the packaged zips
# [19] SHA256SUMS         [20] release notes + opt-in pruning of old build-* releases
# [22] static checks job (scripts/ci/check_pack.py): 26.3 pitfalls, macro lines, function/tag references,
#      scoreboard objectives, unused functions, json, pack.mcmeta      [23] mecha errors as inline annotations
# [24] mecha version pinned (MECHA_VERSION below), still no dependency file needed
# Independent jobs (no `needs`, nothing else waits for them; any of them can be deleted on its own):
# [25] hygiene       stray binaries, big files, secrets, CRLF, whitespace, header comments
# [26] docs          README mentions of functions that no longer exist, public functions missing from the README
# [27] reference     REFERENCE.md artifact generated from the code (functions, objectives, storages, tags)
# [28] pr-summary    what a pull request changes, in the job summary
# [29] workflow-lint actionlint (pinned + checksum verified) on the workflow files
# [30] canary        weekly: newest mecha, and `ubuntu-latest` instead of the pinned image
# [31] mc-drift      weekly: does a new Minecraft release use a higher data pack format?
# [32] smoke         opt-in: load the packs into a real vanilla server and read its log
# [33] reproducible  the zips must come out byte-identical when built twice
# In the existing jobs: [34] BUILD_INFO.json  [35] "files changed since the previous release" in the release notes
# [36] strict mode (warnings fail the run) via the `strict` input or the repository variable CHECK_STRICT
# [39] mc-test     downloads the Minecraft *client* JAR (hash-verified), dumps that version's command tree with the vanilla
#                  data generator and walks every command in every pack against it; plus a taint-based security scan
#                  (scripts/ci/mc_test.py). Opens / updates / closes GitHub issues. Independent: nothing needs it.
# Repo files that go with this: .gitattributes [38] keeps LF line endings, .github/dependabot.yml [37] bumps actions.

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # [6] catches drift (new mecha / runner image) even when nobody pushes
  schedule:
    - cron: "23 4 * * 1"
  # [5]
  workflow_dispatch:
    inputs:
      publish:
        description: "Also publish a release from this run (only on main)"
        type: boolean
        default: false
      prune_keep:
        description: "After publishing keep only the newest N build-* releases (0 = keep all)"
        type: number
        default: 0
      # [36]
      strict:
        description: "Strict mode: warnings from the static checks fail the run"
        type: boolean
        default: false
      # [32]
      mc_version:
        description: "Minecraft version for the server smoke test (empty = the default below)"
        type: string
        default: ""

# [1] read-only by default; only the publish job gets write access
permissions:
  contents: read

# [2] a new push cancels the older run of the same ref, but never a run on main (it may be publishing)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # [24] bump deliberately (and check the lint job) when a new mecha release should be used
  MECHA_VERSION: "0.101.0"
  # [32] the version the smoke test starts; keep it in step with `min_format` / `max_format` in pack.mcmeta
  MC_VERSION: "26.3"

jobs:
  lint:
    # [8] every pack in the repo, not just the root one (`mecha .` never looked at examples/)
    name: lint (${{ matrix.pack }})
    # [3] pinned image: `ubuntu-latest` moves to Ubuntu 26 from 19 Oct 2026
    runs-on: ubuntu-24.04
    # [4]
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        pack: [ ".", "examples/guikit-demo" ]

    steps:
      - uses: actions/checkout@v7

      - name: Show Python version
        run: python3 --version

      - name: Install mecha
        run: python3 -m pip install --user "mecha==$MECHA_VERSION"

      # [23] mecha prints `ERROR | mecha <msg>` + `| file:line:col`; the matcher turns that into annotations
      - name: Register problem matcher
        run: echo "::add-matcher::.github/ci/mecha-matcher.json"

      - name: Run mecha
        run: python3 -m mecha "${{ matrix.pack }}"

      # [9] mecha's default pipeline only compiles .mcfunction files; advancement/tag json under
      # data/ is never parsed, so a broken json (trailing comma, bad quoting) would pass mecha
      # silently and only surface in-game. python -m json.tool catches that at CI time instead.
      - name: Validate JSON files
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' f; do
            if ! python3 -m json.tool "$f" > /dev/null 2>&1; then
              echo "::error file=$f::invalid JSON"
              fail=1
            fi
          done < <(find "${{ matrix.pack }}/data" -name '*.json' -print0 2>/dev/null || true)
          exit "$fail"

  # [10] mecha lints code inside each pack but never compares packs to each other. This job checks
  # the one cross-pack contract that matters here: the demo's pack.mcmeta must declare the same
  # format range as the core pack, otherwise the demo can silently claim support for a version the
  # core datapack doesn't (or vice versa).
  pack-metadata:
    name: pack.mcmeta consistency
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Compare min_format / max_format across packs
        run: |
          set -euo pipefail
          root_min=$(python3 -c "import json; print(json.load(open('pack.mcmeta'))['pack']['min_format'])")
          root_max=$(python3 -c "import json; print(json.load(open('pack.mcmeta'))['pack']['max_format'])")
          demo_min=$(python3 -c "import json; print(json.load(open('examples/guikit-demo/pack.mcmeta'))['pack']['min_format'])")
          demo_max=$(python3 -c "import json; print(json.load(open('examples/guikit-demo/pack.mcmeta'))['pack']['max_format'])")
          echo "root: min_format=$root_min max_format=$root_max"
          echo "demo: min_format=$demo_min max_format=$demo_max"
          if [ "$root_min" != "$demo_min" ] || [ "$root_max" != "$demo_max" ]; then
            echo "::error::pack.mcmeta format range mismatch between root and examples/guikit-demo"
            exit 1
          fi

  # [22] everything mecha does not look at, see scripts/ci/check_pack.py (run it locally the same way)
  checks:
    name: static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Install mecha
        run: python3 -m pip install --user "mecha==$MECHA_VERSION"

      - name: Run checks
        env:
          # [36]
          CHECK_STRICT: ${{ inputs.strict && '1' || vars.CHECK_STRICT || '0' }}
        run: python3 scripts/ci/check_pack.py

  # [25]
  hygiene:
    name: hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Repository hygiene
        env:
          CHECK_STRICT: ${{ inputs.strict && '1' || vars.CHECK_STRICT || '0' }}
        run: python3 scripts/ci/check_pack.py hygiene

  # [26]
  docs:
    name: docs drift
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: README versus the code
        env:
          CHECK_STRICT: ${{ inputs.strict && '1' || vars.CHECK_STRICT || '0' }}
        run: python3 scripts/ci/check_pack.py docs

  # [27] a generated overview of what the pack defines, downloadable from the run
  reference:
    name: reference
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Generate REFERENCE.md
        run: |
          set -euo pipefail
          python3 scripts/ci/check_pack.py reference --out REFERENCE.md
          sed -n '1,/^## Functions/p' REFERENCE.md | head -n -1 >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reference
        uses: actions/upload-artifact@v7
        with:
          name: reference
          path: REFERENCE.md
          if-no-files-found: error
          retention-days: 14

  # [28] pull requests only: needs the base commit, so the whole history is fetched
  pr-summary:
    name: PR summary
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Summarise the changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ci/check_pack.py pr-summary

  # [29] the workflow files themselves; the binary is pinned and verified against its published checksum
  workflow-lint:
    name: workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: actionlint
        env:
          ACTIONLINT_VERSION: "1.7.7"
          ACTIONLINT_SHA256: "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"
        run: |
          set -euo pipefail
          curl -sSfL -o actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tgz" | sha256sum -c -
          tar -xzf actionlint.tgz actionlint
          ./actionlint -color

  # [30] weekly / manual only, so a red canary never blocks a pull request
  canary:
    name: canary (${{ matrix.name }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: newest mecha
            runner: ubuntu-24.04
            mecha: ""
          - name: ubuntu-latest
            runner: ubuntu-latest
            mecha: "0.101.0"

    steps:
      - uses: actions/checkout@v7

      - name: Install mecha
        env:
          PIN: ${{ matrix.mecha }}
        run: python3 -m pip install --user "mecha${PIN:+==$PIN}"

      - name: Lint every pack and run the checks
        run: |
          set -euo pipefail
          python3 -m mecha --version || true
          python3 -m mecha .
          python3 -m mecha examples/guikit-demo
          python3 scripts/ci/check_pack.py

  # [31] advisory: warnings only, unless the repository variable DRIFT_FAIL is 1
  mc-drift:
    name: Minecraft drift
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Compare data pack formats
        env:
          DRIFT_FAIL: ${{ vars.DRIFT_FAIL }}
          MC_VERSION: ${{ inputs.mc_version || env.MC_VERSION }}
        run: python3 scripts/ci/mc_drift.py

  # [32] opt-in on pull requests / pushes (repository variable SMOKE_TEST=1), always on weekly and manual runs.
  # Nothing waits for it: build and publish do not depend on this job.
  smoke:
    name: server smoke test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || vars.SMOKE_TEST == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MC_VERSION: ${{ inputs.mc_version || '26.3' }}

    steps:
      - uses: actions/checkout@v7

      - name: Which Java does this Minecraft version need?
        id: meta
        run: python3 scripts/ci/smoke_server.py meta

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ steps.meta.outputs.java }}

      - name: Start the server, reload, check the log
        run: python3 scripts/ci/smoke_server.py run

      - name: Upload the server log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-log
          path: smoke-server/smoke.log
          if-no-files-found: ignore
          retention-days: 7

  # [39] Why the client JAR and not the server: the client jar carries the vanilla data generator, whose `commands.json` is
  # the Brigadier tree of exactly this Minecraft version; the client itself cannot start on a headless runner (the real
  # /reload is what `smoke` above does). Runs on pull requests and pushes too, but never for forks (no token for issues).
  # A failed run opens ONE issue per problem (deduplicated by a hidden fingerprint), comments while it persists and closes it
  # when it is gone. Security findings need a player-controlled value to *reach* a macro sink; a documented sink alone is not a finding.
  mc-test:
    name: mc-test (client ${{ inputs.mc_version || '26.3' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # least privilege: only this job may write issues; the workflow default stays contents: read
    permissions:
      contents: read
      issues: write
    env:
      MC_VERSION: ${{ inputs.mc_version || '26.3' }}
      # command-tree mismatches are warnings until MC_TEST_STRICT=1 (repository variable): see the note in mc_test.py
      MC_TEST_STRICT: ${{ vars.MC_TEST_STRICT || '0' }}

    steps:
      - uses: actions/checkout@v7

      - name: Which Java does this Minecraft version need?
        id: meta
        run: python3 scripts/ci/mc_test.py meta

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ steps.meta.outputs.java }}

      # continue-on-error so the issue step still runs; the job is failed explicitly at the end
      - name: Download client.jar, dump the command tree, validate, scan
        id: test
        continue-on-error: true
        run: python3 scripts/ci/mc_test.py test

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mc-test-findings
          path: mc-test/findings.json
          if-no-files-found: ignore
          retention-days: 14

      # Issues are only written for pushes to main, the weekly run and manual runs: a pull request from a fork has a
      # read-only token, and a pull request should show its problems as annotations, not as new issues.
      - name: Open / update / close issues
        if: >-
          always() &&
          (github.event_name != 'pull_request') &&
          hashFiles('mc-test/findings.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/mc_test.py issues --findings mc-test/findings.json

      - name: Fail the job if the test failed
        if: steps.test.outcome == 'failure'
        run: |
          echo "::error title=mc-test::mc-test found errors, see the annotations and the job summary"
          exit 1

  # [33] the zips must not depend on the clock or the runner. This guard found a real one: `git archive HEAD:examples/guikit-demo`
  # stamped the current time into guikit-demo.zip, so that zip was never reproducible (fixed with --mtime in `build` too)
  reproducible:
    name: reproducible zips
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Build twice and compare
        run: |
          set -euo pipefail
          when=$(git log -1 --format=%cI)
          build() {
            git archive --format=zip -9 --mtime="$when" -o "$1/datapack.zip" HEAD pack.mcmeta data LICENSE README.md
            git archive --format=zip -9 --mtime="$when" -o "$1/guikit-demo.zip" HEAD:examples/guikit-demo
          }
          mkdir first second
          build first
          sleep 2
          build second
          for z in datapack.zip guikit-demo.zip; do
            if ! cmp "first/$z" "second/$z"; then
              echo "::error::$z differs between two builds of the same commit"; exit 1
            fi
          done
          sha256sum first/*.zip

  build:
    needs: [ lint, pack-metadata, checks ]
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      # [17] two archives built with `git archive`: reproducible, tracked files only, so examples/ and
      # .github/ can never leak into the datapack. datapack.zip keeps its old name (download links stay valid).
      - name: Package datapacks
        run: |
          set -euo pipefail
          # --mtime: a tree-ish such as HEAD:examples/guikit-demo has no commit time, so git would stamp the current time
          # into the zip and every build would differ; pin it to the commit date
          when=$(git log -1 --format=%cI)
          git archive --format=zip -9 --mtime="$when" -o datapack.zip HEAD pack.mcmeta data LICENSE README.md
          git archive --format=zip -9 --mtime="$when" -o guikit-demo.zip HEAD:examples/guikit-demo

      # [18] structure and size of what will be released
      - name: Verify archives
        run: |
          set -euo pipefail
          # list first, then grep the variable: `unzip -Z1 | grep -q` under pipefail fails at random (grep exits
          # at the first hit, unzip gets SIGPIPE and the pipeline reports failure; ~1 run in 5 here)
          for z in datapack.zip guikit-demo.zip; do
            entries=$(unzip -Z1 "$z")
            grep -qx 'pack.mcmeta' <<< "$entries" || { echo "::error::$z has no pack.mcmeta at its root"; exit 1; }
            grep -q '^data/' <<< "$entries" || { echo "::error::$z has no data/ folder"; exit 1; }
            size=$(stat -c%s "$z")
            if [ "$size" -ge 5242880 ]; then echo "::error::$z is $size bytes (limit 5 MiB)"; exit 1; fi
          done
          core=$(unzip -Z1 datapack.zip)
          if grep -qE '^(examples|scripts|\.github)/' <<< "$core"; then
            echo "::error::datapack.zip contains repo-only folders"; exit 1
          fi
          {
            echo "### Packages"; echo
            echo "| file | bytes | entries |"; echo "| --- | ---: | ---: |"
            for z in datapack.zip guikit-demo.zip; do
              echo "| \`$z\` | $(stat -c%s "$z") | $(unzip -Z1 "$z" | wc -l) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # [21] the git-archive step is expected to be a straight copy of tracked files, but this
      # confirms the zip mecha would see is still a well-formed pack after packaging (catches a
      # broken archive step, not a code issue lint would already have caught).
      - name: Re-validate packaged zips with mecha
        run: |
          set -euo pipefail
          python3 -m pip install --user "mecha==$MECHA_VERSION"
          rm -rf verify_core verify_demo
          unzip -q datapack.zip -d verify_core
          unzip -q guikit-demo.zip -d verify_demo
          python3 -m mecha verify_core
          python3 -m mecha verify_demo

      # [19]
      - name: Checksums
        run: sha256sum datapack.zip guikit-demo.zip | tee SHA256SUMS.txt

      # [34] which commit and which tools produced these files (and their hashes), as machine-readable JSON
      - name: Build info
        run: |
          python3 - <<'PY' > BUILD_INFO.json
          import datetime, hashlib, json, os, subprocess
          def git(*a):
              return subprocess.run(["git", *a], capture_output=True, text=True).stdout.strip()
          def sha(f):
              return hashlib.sha256(open(f, "rb").read()).hexdigest()
          print(json.dumps({
              "commit": git("rev-parse", "HEAD"),
              "commit_date": git("log", "-1", "--format=%cI"),
              "ref": os.environ.get("GITHUB_REF"),
              "run_number": os.environ.get("GITHUB_RUN_NUMBER"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "mecha": os.environ.get("MECHA_VERSION"),
              "built_at": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
              "files": {f: {"bytes": os.path.getsize(f), "sha256": sha(f)} for f in ("datapack.zip", "guikit-demo.zip")},
          }, indent=2))
          PY
          cat BUILD_INFO.json

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: datapack
          path: |
            datapack.zip
            guikit-demo.zip
            SHA256SUMS.txt
            BUILD_INFO.json
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: datapack
          path: .

      # [35] the release body starts with what changed inside datapack.zip since the previous release. The file is
      # created first and the step that fills it is allowed to fail, so a problem here can never block the release.
      - name: Prepare release body
        run: ': > release-body.md'

      - name: Files changed since the previous release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          prev=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName // empty' 2>/dev/null || true)
          if [ -z "$prev" ]; then echo "no previous release"; exit 0; fi
          mkdir -p prev
          gh release download "$prev" --repo "$GITHUB_REPOSITORY" --pattern datapack.zip --dir prev || { echo "previous release has no datapack.zip"; exit 0; }
          crc() { unzip -v "$1" | awk 'NF>=8 && $7 ~ /^[0-9a-f]{8}$/ && $8 !~ /\/$/ {print $8, $7}' | LC_ALL=C sort; }
          crc prev/datapack.zip > prev.crc
          crc datapack.zip > new.crc
          added=$(LC_ALL=C comm -13 <(cut -d' ' -f1 prev.crc) <(cut -d' ' -f1 new.crc))
          removed=$(LC_ALL=C comm -23 <(cut -d' ' -f1 prev.crc) <(cut -d' ' -f1 new.crc))
          changed=$(LC_ALL=C join prev.crc new.crc | awk '$2 != $3 {print $1}')
          list() {
            printf '**%s (%s)**\n\n' "$1" "$(printf '%s\n' "$2" | grep -c .)"
            printf '%s\n' "$2" | grep . | head -40 | while read -r f; do printf -- '- \x60%s\x60\n' "$f"; done
            echo
          }
          {
            echo "### Files in datapack.zip compared with \`$prev\`"
            echo
            if [ -z "$added$removed$changed" ]; then echo "No file differs."; fi
            if [ -n "$added" ]; then list "Added" "$added"; fi
            if [ -n "$changed" ]; then list "Changed" "$changed"; fi
            if [ -n "$removed" ]; then list "Removed" "$removed"; fi
          } > release-body.md
          cat release-body.md

      # [20] release notes generated from the merged PRs / commits, all four files attached
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: guikit build ${{ github.run_number }}
          body_path: release-body.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            datapack.zip
            guikit-demo.zip
            SHA256SUMS.txt
            BUILD_INFO.json

      # [20] opt-in: set the repository variable PRUNE_KEEP (or the manual input) to N to keep only the newest N build-* releases
      - name: Prune old build releases
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: ${{ inputs.prune_keep || vars.PRUNE_KEEP || '0' }}
        run: |
          set -euo pipefail
          if ! [[ "$KEEP" =~ ^[0-9]+$ ]] || [ "$KEEP" -eq 0 ]; then
            echo "pruning is off (KEEP=$KEEP)"; exit 0
          fi
          gh release list --repo "$GITHUB_REPOSITORY" --limit 300 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[].tagName' \
            | { grep '^build-' || true; } | tail -n +"$((KEEP + 1))" \
            | while read -r tag; do
                echo "deleting release $tag"
                gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
              done
