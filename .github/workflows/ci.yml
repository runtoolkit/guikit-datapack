# guikit CI: lint -> build -> publish.
# NOTE: this workflow previously used actions/setup-python with cache: pip. Even with no
# cache-dependency-path given, that action still globs the repo for **/requirements.txt or
# **/pyproject.toml to build its cache key — and this repo has neither, so it always failed with
# "No file ... matched, make sure you have checked out the target repository". ubuntu-24.04 runners
# ship Python 3.12 preinstalled, so this workflow skips the action entirely and uses the system
# python3 / pip directly. mecha is installed straight from PyPI; no dependency file needed.
#  [1] least-privilege permissions   [2] concurrency        [3] pinned runner       [4] job timeouts
#  [5] manual inputs                 [6] weekly schedule    [8] lint matrix (all packs)
#  [9] JSON syntax check for every .json in the repo (mecha only parses .mcfunction, not json_files)
# [10] pack.mcmeta consistency check (root vs examples/guikit-demo: same min_format/max_format)
# [17] core + demo zips  [18] zip verification   [21] re-run mecha against the packaged zips
# [19] SHA256SUMS         [20] release notes + opt-in pruning of old build-* releases
# [22] static checks job (scripts/ci/check_pack.py): 26.3 pitfalls, macro lines, function/tag references,
#      scoreboard objectives, unused functions, json, pack.mcmeta      [23] mecha errors as inline annotations
# [24] mecha version pinned (MECHA_VERSION below), still no dependency file needed

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # [6] catches drift (new mecha / runner image) even when nobody pushes
  schedule:
    - cron: "23 4 * * 1"
  # [5]
  workflow_dispatch:
    inputs:
      publish:
        description: "Also publish a release from this run (only on main)"
        type: boolean
        default: false
      prune_keep:
        description: "After publishing keep only the newest N build-* releases (0 = keep all)"
        type: number
        default: 0

# [1] read-only by default; only the publish job gets write access
permissions:
  contents: read

# [2] a new push cancels the older run of the same ref, but never a run on main (it may be publishing)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # [24] bump deliberately (and check the lint job) when a new mecha release should be used
  MECHA_VERSION: "0.101.0"

jobs:
  lint:
    # [8] every pack in the repo, not just the root one (`mecha .` never looked at examples/)
    name: lint (${{ matrix.pack }})
    # [3] pinned image: `ubuntu-latest` moves to Ubuntu 26 from 19 Oct 2026
    runs-on: ubuntu-24.04
    # [4]
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        pack: [ ".", "examples/guikit-demo" ]

    steps:
      - uses: actions/checkout@v7

      - name: Show Python version
        run: python3 --version

      - name: Install mecha
        run: python3 -m pip install --user "mecha==$MECHA_VERSION"

      # [23] mecha prints `ERROR | mecha <msg>` + `| file:line:col`; the matcher turns that into annotations
      - name: Register problem matcher
        run: echo "::add-matcher::.github/ci/mecha-matcher.json"

      - name: Run mecha
        run: python3 -m mecha "${{ matrix.pack }}"

      # [9] mecha's default pipeline only compiles .mcfunction files; advancement/tag json under
      # data/ is never parsed, so a broken json (trailing comma, bad quoting) would pass mecha
      # silently and only surface in-game. python -m json.tool catches that at CI time instead.
      - name: Validate JSON files
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' f; do
            if ! python3 -m json.tool "$f" > /dev/null 2>&1; then
              echo "::error file=$f::invalid JSON"
              fail=1
            fi
          done < <(find "${{ matrix.pack }}/data" -name '*.json' -print0 2>/dev/null || true)
          exit "$fail"

  # [10] mecha lints code inside each pack but never compares packs to each other. This job checks
  # the one cross-pack contract that matters here: the demo's pack.mcmeta must declare the same
  # format range as the core pack, otherwise the demo can silently claim support for a version the
  # core datapack doesn't (or vice versa).
  pack-metadata:
    name: pack.mcmeta consistency
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Compare min_format / max_format across packs
        run: |
          set -euo pipefail
          root_min=$(python3 -c "import json; print(json.load(open('pack.mcmeta'))['pack']['min_format'])")
          root_max=$(python3 -c "import json; print(json.load(open('pack.mcmeta'))['pack']['max_format'])")
          demo_min=$(python3 -c "import json; print(json.load(open('examples/guikit-demo/pack.mcmeta'))['pack']['min_format'])")
          demo_max=$(python3 -c "import json; print(json.load(open('examples/guikit-demo/pack.mcmeta'))['pack']['max_format'])")
          echo "root: min_format=$root_min max_format=$root_max"
          echo "demo: min_format=$demo_min max_format=$demo_max"
          if [ "$root_min" != "$demo_min" ] || [ "$root_max" != "$demo_max" ]; then
            echo "::error::pack.mcmeta format range mismatch between root and examples/guikit-demo"
            exit 1
          fi

  # [22] everything mecha does not look at, see scripts/ci/check_pack.py (run it locally the same way)
  checks:
    name: static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Install mecha
        run: python3 -m pip install --user "mecha==$MECHA_VERSION"

      - name: Run checks
        run: python3 scripts/ci/check_pack.py

  build:
    needs: [ lint, pack-metadata, checks ]
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      # [17] two archives built with `git archive`: reproducible, tracked files only, so examples/ and
      # .github/ can never leak into the datapack. datapack.zip keeps its old name (download links stay valid).
      - name: Package datapacks
        run: |
          set -euo pipefail
          git archive --format=zip -9 -o datapack.zip HEAD pack.mcmeta data LICENSE README.md
          git archive --format=zip -9 -o guikit-demo.zip HEAD:examples/guikit-demo

      # [18] structure and size of what will be released
      - name: Verify archives
        run: |
          set -euo pipefail
          # list first, then grep the variable: `unzip -Z1 | grep -q` under pipefail fails at random (grep exits
          # at the first hit, unzip gets SIGPIPE and the pipeline reports failure; ~1 run in 5 here)
          for z in datapack.zip guikit-demo.zip; do
            entries=$(unzip -Z1 "$z")
            grep -qx 'pack.mcmeta' <<< "$entries" || { echo "::error::$z has no pack.mcmeta at its root"; exit 1; }
            grep -q '^data/' <<< "$entries" || { echo "::error::$z has no data/ folder"; exit 1; }
            size=$(stat -c%s "$z")
            if [ "$size" -ge 5242880 ]; then echo "::error::$z is $size bytes (limit 5 MiB)"; exit 1; fi
          done
          core=$(unzip -Z1 datapack.zip)
          if grep -qE '^(examples|scripts|\.github)/' <<< "$core"; then
            echo "::error::datapack.zip contains repo-only folders"; exit 1
          fi
          {
            echo "### Packages"; echo
            echo "| file | bytes | entries |"; echo "| --- | ---: | ---: |"
            for z in datapack.zip guikit-demo.zip; do
              echo "| \`$z\` | $(stat -c%s "$z") | $(unzip -Z1 "$z" | wc -l) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # [21] the git-archive step is expected to be a straight copy of tracked files, but this
      # confirms the zip mecha would see is still a well-formed pack after packaging (catches a
      # broken archive step, not a code issue lint would already have caught).
      - name: Re-validate packaged zips with mecha
        run: |
          set -euo pipefail
          python3 -m pip install --user "mecha==$MECHA_VERSION"
          rm -rf verify_core verify_demo
          unzip -q datapack.zip -d verify_core
          unzip -q guikit-demo.zip -d verify_demo
          python3 -m mecha verify_core
          python3 -m mecha verify_demo

      # [19]
      - name: Checksums
        run: sha256sum datapack.zip guikit-demo.zip | tee SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: datapack
          path: |
            datapack.zip
            guikit-demo.zip
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v7
        with:
          name: datapack
          path: .

      # [20] release notes generated from the merged PRs / commits, all three files attached
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: guikit build ${{ github.run_number }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            datapack.zip
            guikit-demo.zip
            SHA256SUMS.txt

      # [20] opt-in: set the repository variable PRUNE_KEEP (or the manual input) to N to keep only the newest N build-* releases
      - name: Prune old build releases
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: ${{ inputs.prune_keep || vars.PRUNE_KEEP || '0' }}
        run: |
          set -euo pipefail
          if ! [[ "$KEEP" =~ ^[0-9]+$ ]] || [ "$KEEP" -eq 0 ]; then
            echo "pruning is off (KEEP=$KEEP)"; exit 0
          fi
          gh release list --repo "$GITHUB_REPOSITORY" --limit 300 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[].tagName' \
            | { grep '^build-' || true; } | tail -n +"$((KEEP + 1))" \
            | while read -r tag; do
                echo "deleting release $tag"
                gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
              done
