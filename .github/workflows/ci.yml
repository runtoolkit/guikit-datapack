# guikit CI: lint -> build -> publish.
# NOTE: this workflow previously referenced scripts/ci/check_pack.py and .github/ci/requirements.txt /
# mecha-matcher.json. None of those files exist in this repo, which is why lint and static checks were
# failing with "No file ... matched, make sure you have checked out the target repository" — setup-python's
# pip cache and the install step were pointed at paths that were never created. This version only uses
# what's actually in the repo: mecha installed directly from PyPI, no extra check script, no matcher file.
#  [1] least-privilege permissions   [2] concurrency        [3] pinned runner       [4] job timeouts
#  [5] manual inputs                 [6] weekly schedule    [7] pinned tools + pip cache
#  [8] lint matrix (all packs)       [17] core + demo zips  [18] zip verification   [19] SHA256SUMS
# [20] release notes + opt-in pruning of old build-* releases

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # [6] catches drift (new mecha / runner image) even when nobody pushes
  schedule:
    - cron: "23 4 * * 1"
  # [5]
  workflow_dispatch:
    inputs:
      publish:
        description: "Also publish a release from this run (only on main)"
        type: boolean
        default: false
      prune_keep:
        description: "After publishing keep only the newest N build-* releases (0 = keep all)"
        type: number
        default: 0

# [1] read-only by default; only the publish job gets write access
permissions:
  contents: read

# [2] a new push cancels the older run of the same ref, but never a run on main (it may be publishing)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    # [8] every pack in the repo, not just the root one (`mecha .` never looked at examples/)
    name: lint (${{ matrix.pack }})
    # [3] pinned image: `ubuntu-latest` moves to Ubuntu 26 from 19 Oct 2026
    runs-on: ubuntu-24.04
    # [4]
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        pack: [ ".", "examples/guikit-demo" ]

    steps:
      - uses: actions/checkout@v7

      # [7] cached pip; no dependency file in this repo, so cache keys off the pip install command itself
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install mecha
        run: pip install mecha

      - name: Run mecha
        run: mecha "${{ matrix.pack }}"

  build:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      # [17] two archives built with `git archive`: reproducible, tracked files only, so examples/ and
      # .github/ can never leak into the datapack. datapack.zip keeps its old name (download links stay valid).
      - name: Package datapacks
        run: |
          set -euo pipefail
          git archive --format=zip -9 -o datapack.zip HEAD pack.mcmeta data LICENSE README.md
          git archive --format=zip -9 -o guikit-demo.zip HEAD:examples/guikit-demo

      # [18] structure and size of what will be released
      - name: Verify archives
        run: |
          set -euo pipefail
          for z in datapack.zip guikit-demo.zip; do
            unzip -Z1 "$z" | grep -qx 'pack.mcmeta' || { echo "::error::$z has no pack.mcmeta at its root"; exit 1; }
            unzip -Z1 "$z" | grep -q '^data/' || { echo "::error::$z has no data/ folder"; exit 1; }
            size=$(stat -c%s "$z")
            if [ "$size" -ge 5242880 ]; then echo "::error::$z is $size bytes (limit 5 MiB)"; exit 1; fi
          done
          if unzip -Z1 datapack.zip | grep -qE '^(examples|\.github)/'; then
            echo "::error::datapack.zip contains repo-only folders"; exit 1
          fi
          {
            echo "### Packages"; echo
            echo "| file | bytes | entries |"; echo "| --- | ---: | ---: |"
            for z in datapack.zip guikit-demo.zip; do
              echo "| \`$z\` | $(stat -c%s "$z") | $(unzip -Z1 "$z" | wc -l) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # [19]
      - name: Checksums
        run: sha256sum datapack.zip guikit-demo.zip | tee SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: datapack
          path: |
            datapack.zip
            guikit-demo.zip
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v7
        with:
          name: datapack
          path: .

      # [20] release notes generated from the merged PRs / commits, all three files attached
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: guikit build ${{ github.run_number }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            datapack.zip
            guikit-demo.zip
            SHA256SUMS.txt

      # [20] opt-in: set the repository variable PRUNE_KEEP (or the manual input) to N to keep only the newest N build-* releases
      - name: Prune old build releases
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: ${{ inputs.prune_keep || vars.PRUNE_KEEP || '0' }}
        run: |
          set -euo pipefail
          if ! [[ "$KEEP" =~ ^[0-9]+$ ]] || [ "$KEEP" -eq 0 ]; then
            echo "pruning is off (KEEP=$KEEP)"; exit 0
          fi
          gh release list --repo "$GITHUB_REPOSITORY" --limit 300 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[].tagName' \
            | { grep '^build-' || true; } | tail -n +"$((KEEP + 1))" \
            | while read -r tag; do
                echo "deleting release $tag"
                gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
              done
