# .github/workflows/guikit-fix-and-restructure.yml
#
# This workflow automates changes previously applied manually on guikit-datapack:
#   1) Two real bug fixes:
#      - cond/check.mcfunction: fix {type:"all"/"any", not:1b} combination not working
#        (never reached the negate line due to early "return run function")
#      - internal/dispose_cart.mcfunction: dynamic/recursive cleanup based on
#        guikit.slots instead of fixed 27 slot cleanup (generated failing commands on
#        containers with fewer than 27 slots like hopper_minecart)
#   2) Moves 65 flat files in internal/ directory to logical subfolders
#      (btn/, meter/, pad/, progress/, summon/, clear/, cooldown/,
#      sweep/) and updates ALL "function guikit:internal/..." references
#      (including core pack + examples/guikit-demo) to new paths.
#   3) Performs lint validation with mecha (checks syntax; as README itself
#      warns, this does NOT catch logic errors, only parse errors).
#   4) Packages the restructured datapack as a full .zip and publishes as
#      artifact + release.
#
# Trigger: push to main, manual trigger (workflow_dispatch), or PR.
# This workflow "automatically converts old to new": it is idempotent — if files
# are already in new location, move steps are skipped silently (|| true / -f check),
# meaning it is safe to run the workflow multiple times.

name: guikit fix and restructure

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  fix-and-restructure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python (for mecha lint)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install mecha
        run: pip install --quiet mecha beet

      # ---------------------------------------------------------------
      # STEP 0: Log pre-change state (for reference)
      # ---------------------------------------------------------------
      - name: Show previous state
        run: |
          echo "== Flat file count in internal/ folder =="
          find data/guikit/function/internal -maxdepth 1 -type f | wc -l

      # ---------------------------------------------------------------
      # STEP 1: BUG FIX #1 — cond/check.mcfunction
      # Make {type:"all"/"any", not:1b} combination functional.
      # "return run function" -> "run function" (remove early exit,
      # allow flow to reach the not:1b line)
      # ---------------------------------------------------------------
      - name: "Bug fix 1: cond/check.mcfunction (all/any + not:1b)"
        run: |
          set -euo pipefail
          f="data/guikit/function/cond/check.mcfunction"
          if grep -q 'run return run function guikit:cond/t_all' "$f"; then
            sed -i \
              -e 's#run return run function guikit:cond/t_all#run function guikit:cond/t_all#' \
              -e 's#run return run function guikit:cond/t_any#run function guikit:cond/t_any#' \
              "$f"
            echo "Fix applied: check.mcfunction"
          else
            echo "Fix already applied, skipping (idempotent)"
          fi
          grep -n 'cond/t_all\|cond/t_any' "$f"

      # ---------------------------------------------------------------
      # STEP 2: BUG FIX #2 — internal/dispose_cart.mcfunction
      # Dynamic/recursive cleanup based on guikit.slots instead of fixed 27 slots.
      # New helper files: internal/dispose_slot.mcfunction and
      # internal/dispose_slot_do.mcfunction (written to flat internal/ folder
      # before moving; will be moved under internal/pad/ in step 3 along with others)
      # ---------------------------------------------------------------
      - name: "Bug fix 2: internal/dispose_cart.mcfunction (dynamic slot cleanup)"
        run: |
          set -euo pipefail
          target="data/guikit/function/internal/dispose_cart.mcfunction"
          if [ -f "$target" ] && grep -q 'container\.26' "$target"; then
            cat > "$target" << 'EOF'
          # guikit :: dispose_cart   as cart - empty first so kill does not drop GUI items
          # Only clears the cart's own slot count (guikit.slots, set at summon time): a hard-coded
          # container.0..26 here would run item replace on slots past a hopper_minecart's real 5
          # (or any future non-27-slot container), which fails per slot and littered the log without
          # actually stopping the kill that follows.
          scoreboard players operation #ds guikit.tmp = @s guikit.slots
          execute unless score #ds guikit.tmp matches 1.. run scoreboard players set #ds guikit.tmp 27
          function guikit:internal/dispose_slot
          kill @s
          EOF

            cat > "data/guikit/function/internal/dispose_slot.mcfunction" << 'EOF'
          # guikit :: internal/dispose_slot     as cart     #ds = slots still to clear
          # Same recursion shape as internal/pad_step: clears slot #ds-1, then recurses to 0.
          scoreboard players remove #ds guikit.tmp 1
          execute store result storage guikit:ctx i int 1 run scoreboard players get #ds guikit.tmp
          function guikit:internal/dispose_slot_do with storage guikit:ctx
          execute if score #ds guikit.tmp matches 1.. run function guikit:internal/dispose_slot
          EOF

            cat > "data/guikit/function/internal/dispose_slot_do.mcfunction" << 'EOF'
          # macro: $(i)     as cart$item replace entity @s container.$(i) with minecraft:air
          EOF
            echo "Fix applied: dispose_cart.mcfunction + 2 new helper files created"
          else
            echo "Fix already applied or file not found, skipping (idempotent)"
          fi

      # ---------------------------------------------------------------
      # STEP 3: DIRECTORY RESTRUCTURING
      # Move flat files under internal/ to logical subfolders
      # and update ALL references (core + examples).
      #
      # Note: immediately after each group is moved, references for that group
      # are updated, in the same manual order (btn -> meter -> pad ->
      # progress -> summon -> clear -> cooldown -> sweep), handling name
      # collisions (e.g. "summon" being both an old file and new folder)
      # with the same care.
      # ---------------------------------------------------------------
      - name: "Restructure: internal/btn/*"
        run: |
          set -euo pipefail
          base="data/guikit/function/internal"
          mkdir -p "$base/btn"
          declare -A MAP=(
            [btn_afford]=afford [btn_afford_item]=afford_item [btn_afford_score]=afford_score
            [btn_click]=click [btn_cmd]=cmd [btn_cond]=cond [btn_deny]=deny [btn_gate]=gate
            [btn_pay]=pay [btn_pay_item]=pay_item [btn_poor]=poor [btn_url]=url [btn_visual]=visual
            [clear_btn_cur]=clear_cur
          )
          for old in "${!MAP[@]}"; do
            new="${MAP[$old]}"
            [ -f "$base/${old}.mcfunction" ] && git mv "$base/${old}.mcfunction" "$base/btn/${new}.mcfunction" || true
          done

          FILES=$(grep -rl "guikit:internal/btn_\|guikit:internal/clear_btn_cur" data examples 2>/dev/null || true)
          for f in $FILES; do
            sed -i \
              -e 's#guikit:internal/btn_afford_item#guikit:internal/btn/afford_item#g' \
              -e 's#guikit:internal/btn_afford_score#guikit:internal/btn/afford_score#g' \
              -e 's#guikit:internal/btn_afford#guikit:internal/btn/afford#g' \
              -e 's#guikit:internal/btn_pay_item#guikit:internal/btn/pay_item#g' \
              -e 's#guikit:internal/btn_pay#guikit:internal/btn/pay#g' \
              -e 's#guikit:internal/btn_click#guikit:internal/btn/click#g' \
              -e 's#guikit:internal/btn_cmd#guikit:internal/btn/cmd#g' \
              -e 's#guikit:internal/btn_cond#guikit:internal/btn/cond#g' \
              -e 's#guikit:internal/btn_deny#guikit:internal/btn/deny#g' \
              -e 's#guikit:internal/btn_gate#guikit:internal/btn/gate#g' \
              -e 's#guikit:internal/btn_poor#guikit:internal/btn/poor#g' \
              -e 's#guikit:internal/btn_url#guikit:internal/btn/url#g' \
              -e 's#guikit:internal/btn_visual#guikit:internal/btn/visual#g' \
              -e 's#guikit:internal/clear_btn_cur#guikit:internal/btn/clear_cur#g' \
              "$f"
          done
          # fix old names in comment lines (if any)
          if [ -d "$base/btn" ]; then
            grep -rl "internal/btn_\|internal/clear_btn_cur" "$base/btn" 2>/dev/null | while read -r f; do
              sed -i -E 's#internal/(btn_[a-z_]+|clear_btn_cur)#internal/btn/\1#' "$f"
              sed -i -E 's#internal/btn/btn_#internal/btn/#' "$f"
              sed -i -E 's#internal/btn/clear_btn_cur#internal/btn/clear_cur#' "$f"
            done
          fi

      - name: "Restructure: internal/meter/*"
        run: |
          set -euo pipefail
          base="data/guikit/function/internal"
          mkdir -p "$base/meter"
          declare -A MAP=( [meter_hit]=hit [meter_loop]=loop [meter_probe_loop]=probe_loop [meter_slot]=slot )
          for old in "${!MAP[@]}"; do
            new="${MAP[$old]}"
            [ -f "$base/${old}.mcfunction" ] && git mv "$base/${old}.mcfunction" "$base/meter/${new}.mcfunction" || true
          done
          FILES=$(grep -rl "guikit:internal/meter_" data examples 2>/dev/null || true)
          for f in $FILES; do
            sed -i \
              -e 's#guikit:internal/meter_probe_loop#guikit:internal/meter/probe_loop#g' \
              -e 's#guikit:internal/meter_hit#guikit:internal/meter/hit#g' \
              -e 's#guikit:internal/meter_loop#guikit:internal/meter/loop#g' \
              -e 's#guikit:internal/meter_slot#guikit:internal/meter/slot#g' \
              "$f"
          done
          if [ -d "$base/meter" ]; then
            grep -rl "internal/meter_" "$base/meter" 2>/dev/null | while read -r f; do
              sed -i -E 's#internal/meter_(hit|loop|probe_loop|slot)#internal/meter/\1#g' "$f"
            done
          fi

      - name: "Restructure: internal/pad/* (pad_* + dispose_*)"
        run: |
          set -euo pipefail
          base="data/guikit/function/internal"
          mkdir -p "$base/pad"
          declare -A MAP=(
            [pad_load]=load [pad_slot]=slot [pad_step]=step
            [dispose_cart]=dispose_cart [dispose_slot]=dispose_slot [dispose_slot_do]=dispose_slot_do
          )
          for old in "${!MAP[@]}"; do
            new="${MAP[$old]}"
            if [ -f "$base/${old}.mcfunction" ]; then
              git mv "$base/${old}.mcfunction" "$base/pad/${new}.mcfunction" 2>/dev/null || \
                mv "$base/${old}.mcfunction" "$base/pad/${new}.mcfunction"
            fi
          done
          FILES=$(grep -rl "guikit:internal/pad_\|guikit:internal/dispose_" data examples 2>/dev/null || true)
          for f in $FILES; do
            sed -i \
              -e 's#guikit:internal/pad_load#guikit:internal/pad/load#g' \
              -e 's#guikit:internal/pad_slot#guikit:internal/pad/slot#g' \
              -e 's#guikit:internal/pad_step#guikit:internal/pad/step#g' \
              -e 's#guikit:internal/dispose_slot_do#guikit:internal/pad/dispose_slot_do#g' \
              -e 's#guikit:internal/dispose_slot#guikit:internal/pad/dispose_slot#g' \
              -e 's#guikit:internal/dispose_cart#guikit:internal/pad/dispose_cart#g' \
              "$f"
          done
          if [ -d "$base/pad" ]; then
            grep -rl "internal/pad_\|internal/dispose_\|:: dispose_cart\b\|:: internal/pad_step\b" "$base/pad" 2>/dev/null | while read -r f; do
              sed -i \
                -e 's#internal/dispose_slot#internal/pad/dispose_slot#g' \
                -e 's#internal/pad_step#internal/pad/step#g' \
                -e 's#guikit :: dispose_cart#guikit :: internal/pad/dispose_cart#' \
                -e 's#guikit :: internal/pad_step#guikit :: internal/pad/step#' \
                "$f"
            done
          fi

      - name: "Restructure: internal/progress/*"
        run: |
          set -euo pipefail
          base="data/guikit/function/internal"
          mkdir -p "$base/progress"
          declare -A MAP=( [progress_calc]=calc [progress_loop]=loop [progress_slot]=slot )
          for old in "${!MAP[@]}"; do
            new="${MAP[$old]}"
            [ -f "$base/${old}.mcfunction" ] && git mv "$base/${old}.mcfunction" "$base/progress/${new}.mcfunction" || true
          done
          FILES=$(grep -rl "guikit:internal/progress_" data examples 2>/dev/null || true)
          for f in $FILES; do
            sed -i \
              -e 's#guikit:internal/progress_calc#guikit:internal/progress/calc#g' \
              -e 's#guikit:internal/progress_loop#guikit:internal/progress/loop#g' \
              -e 's#guikit:internal/progress_slot#guikit:internal/progress/slot#g' \
              "$f"
          done

      - name: "Restructure: internal/summon/* (summon_* + cont_* + containers_builtin)"
        run: |
          set -euo pipefail
          base="data/guikit/function/internal"
          mkdir -p "$base/summon"
          # Move standalone "summon" file to "main" to avoid collision with folder
          [ -f "$base/summon.mcfunction" ] && git mv "$base/summon.mcfunction" "$base/summon/main.mcfunction" || true
          declare -A MAP=(
            [summon_legacy]=legacy [summon_resolve]=resolve [summon_titled]=titled [summon_type]=type
            [cont_bind]=bind [cont_unbind]=unbind [containers_builtin]=builtin
          )
          for old in "${!MAP[@]}"; do
            new="${MAP[$old]}"
            [ -f "$base/${old}.mcfunction" ] && git mv "$base/${old}.mcfunction" "$base/summon/${new}.mcfunction" || true
          done

          FILES=$(grep -rl "guikit:internal/summon\|guikit:internal/cont_bind\|guikit:internal/cont_unbind\|guikit:internal/containers_builtin" data examples 2>/dev/null || true)
          # replace long/specific names first, then bare "summon" (order is crucial to prevent collisions)
          for f in $FILES; do
            sed -i \
              -e 's#guikit:internal/summon_legacy#guikit:internal/summon/legacy#g' \
              -e 's#guikit:internal/summon_resolve#guikit:internal/summon/resolve#g' \
              -e 's#guikit:internal/summon_titled#guikit:internal/summon/titled#g' \
              -e 's#guikit:internal/summon_type#guikit:internal/summon/type#g' \
              -e 's#guikit:internal/cont_bind#guikit:internal/summon/bind#g' \
              -e 's#guikit:internal/cont_unbind#guikit:internal/summon/unbind#g' \
              -e 's#guikit:internal/containers_builtin#guikit:internal/summon/builtin#g' \
              "$f"
            sed -i -E 's#function guikit:internal/summon( with| \{|$)#function guikit:internal/summon/main\1#g' "$f"
          done
          if [ -d "$base/summon" ]; then
            grep -rl "internal/containers_builtin" "$base/summon" 2>/dev/null | while read -r f; do
              sed -i 's#internal/containers_builtin#internal/summon/builtin#' "$f"
            done
          fi

      - name: "Restructure: internal/clear/* (clear_* + cleanup_*)"
        run: |
          set -euo pipefail
          base="data/guikit/function/internal"
          mkdir -p "$base/clear"
          declare -A MAP=(
            [clear_cond]=cond [clear_in]=in [clear_mtr]=mtr [clear_tmp]=tmp [clear_w]=w
            [cleanup_player]=player [cleanup_scores]=scores
          )
          for old in "${!MAP[@]}"; do
            new="${MAP[$old]}"
            [ -f "$base/${old}.mcfunction" ] && git mv "$base/${old}.mcfunction" "$base/clear/${new}.mcfunction" || true
          done
          FILES=$(grep -rl "guikit:internal/clear_\|guikit:internal/cleanup_" data examples 2>/dev/null || true)
          for f in $FILES; do
            sed -i \
              -e 's#guikit:internal/clear_cond#guikit:internal/clear/cond#g' \
              -e 's#guikit:internal/clear_in#guikit:internal/clear/in#g' \
              -e 's#guikit:internal/clear_mtr#guikit:internal/clear/mtr#g' \
              -e 's#guikit:internal/clear_tmp#guikit:internal/clear/tmp#g' \
              -e 's#guikit:internal/clear_w#guikit:internal/clear/w#g' \
              -e 's#guikit:internal/cleanup_player#guikit:internal/clear/player#g' \
              -e 's#guikit:internal/cleanup_scores#guikit:internal/clear/scores#g' \
              "$f"
          done

      - name: "Restructure: internal/cooldown/* (cd_*)"
        run: |
          set -euo pipefail
          base="data/guikit/function/internal"
          mkdir -p "$base/cooldown"
          declare -A MAP=( [cd_notify]=notify [cd_set]=set )
          for old in "${!MAP[@]}"; do
            new="${MAP[$old]}"
            [ -f "$base/${old}.mcfunction" ] && git mv "$base/${old}.mcfunction" "$base/cooldown/${new}.mcfunction" || true
          done
          FILES=$(grep -rl "guikit:internal/cd_" data examples 2>/dev/null || true)
          for f in $FILES; do
            sed -i \
              -e 's#guikit:internal/cd_notify#guikit:internal/cooldown/notify#g' \
              -e 's#guikit:internal/cd_set#guikit:internal/cooldown/set#g' \
              "$f"
          done

      - name: "Restructure: internal/sweep/* (sweep_*)"
        run: |
          set -euo pipefail
          base="data/guikit/function/internal"
          mkdir -p "$base/sweep"
          declare -A MAP=( [sweep_orphans]=orphans [sweep_keep]=keep )
          for old in "${!MAP[@]}"; do
            new="${MAP[$old]}"
            [ -f "$base/${old}.mcfunction" ] && git mv "$base/${old}.mcfunction" "$base/sweep/${new}.mcfunction" || true
          done
          FILES=$(grep -rl "guikit:internal/sweep_" data examples 2>/dev/null || true)
          for f in $FILES; do
            sed -i \
              -e 's#guikit:internal/sweep_orphans#guikit:internal/sweep/orphans#g' \
              -e 's#guikit:internal/sweep_keep#guikit:internal/sweep/keep#g' \
              "$f"
          done

      # ---------------------------------------------------------------
      # STEP 4: VALIDATION — mecha lint
      # This validates syntax. As the README itself notes, passing mecha
      # does not mean the datapack will work in-game (it does not validate
      # logic errors or macro lines) — but it catches broken/missing
      # references left by sed (as parse errors) at minimum.
      # ---------------------------------------------------------------
      - name: mecha lint validation
        run: |
          set -euo pipefail
          python3 - << 'PYEOF'
          from beet import run_beet
          config = {"data_pack": {"load": ["."]}, "pipeline": ["mecha.contrib.lint"]}
          run_beet(config)
          print("LINT OK")
          PYEOF

      - name: Verify no old references remain (safety net)
        run: |
          set -euo pipefail
          LEFTOVER=$(grep -rn \
            -e "guikit:internal/btn_" \
            -e "guikit:internal/clear_btn_cur" \
            -e "guikit:internal/meter_" \
            -e "guikit:internal/pad_" \
            -e "guikit:internal/dispose_slot\b" \
            -e "guikit:internal/dispose_cart\b" \
            -e "guikit:internal/progress_" \
            -e "guikit:internal/summon_" \
            -e "guikit:internal/cont_bind" \
            -e "guikit:internal/cont_unbind" \
            -e "guikit:internal/containers_builtin" \
            -e "guikit:internal/clear_cond" \
            -e "guikit:internal/clear_in\b" \
            -e "guikit:internal/clear_mtr" \
            -e "guikit:internal/clear_tmp" \
            -e "guikit:internal/clear_w\b" \
            -e "guikit:internal/cleanup_player" \
            -e "guikit:internal/cleanup_scores" \
            -e "guikit:internal/cd_notify" \
            -e "guikit:internal/cd_set" \
            -e "guikit:internal/sweep_orphans" \
            -e "guikit:internal/sweep_keep" \
            data examples 2>/dev/null || true)
          if [ -n "$LEFTOVER" ]; then
            echo "ERROR: Found un-updated old references:"
            echo "$LEFTOVER"
            exit 1
          fi
          echo "All references clean."

      # ---------------------------------------------------------------
      # STEP 5: CREATE ZIP
      # ---------------------------------------------------------------
      - name: Create datapack zip
        run: |
          set -euo pipefail
          mkdir -p dist
          zip -r "dist/guikit-datapack.zip" . \
            -x ".git/*" \
            -x "dist/*" \
            -x ".github/*"
          echo "Zip created:"
          unzip -l "dist/guikit-datapack.zip" | tail -5

      - name: Upload zip as artifact
        uses: actions/upload-artifact@v4
        with:
          name: guikit-datapack
          path: dist/guikit-datapack.zip
          retention-days: 30

      # ---------------------------------------------------------------
      # STEP 6: COMMIT CHANGES ("automatically convert old to new")
      # Only commits on push/workflow_dispatch trigger; PR only performs
      # validation + artifact generation, does not write to repo.
      # ---------------------------------------------------------------
      - name: Commit and push changes
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name "guikit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes, skipping commit."
          else
            git commit -m "fix: cond all/any not:1b + dynamic dispose_cart; restructure internal/ into subfolders

          - cond/check.mcfunction: all/any now works correctly with not:1b
          - internal/pad/dispose_cart.mcfunction: dynamic/recursive cleanup
            based on guikit.slots instead of fixed 27 slots
          - 65 flat files under internal/ moved to subfolders btn/, meter/, pad/, progress/,
            summon/, clear/, cooldown/, sweep/ and all function references
            (including core + examples/guikit-demo) updated
          - mecha lint validation passed

          Automatically generated: guikit fix and restructure workflow"
            git push
          fi

      - name: Create Release (on main push only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "auto-fix-${{ github.run_number }}"
          name: "guikit-datapack auto fix ${{ github.run_number }}"
          files: dist/guikit-datapack.zip
          body: |
            Automated bug fix + directory restructuring.

            **Bug fixes:**
            - `cond/check.mcfunction`: `{type:"all"/"any", not:1b}` now works as documented
            - `internal/pad/dispose_cart.mcfunction`: dynamic cleanup based on `guikit.slots` (no longer generates erroneous commands in containers with fewer than 27 slots like `hopper_minecart`)

            **Restructuring:**
            The `internal/` folder has been split into subfolders `btn/`, `meter/`, `pad/`, `progress/`, `summon/`, `clear/`, `cooldown/`, and `sweep/`.

            mecha lint passed cleanly in this release (syntax validation only; as README notes, it does not replace actual in-game testing).
